# Модели раскладки против живого оконного менеджера.
#
# Здесь и только здесь исполняется FTS.  В самом digitwm его нет: оконный
# менеджер собирается компилятором C, yacc и тремя библиотеками X, и Node на
# машине пользователя не нужен - иначе NetBSD отпадает.
#
# Сборка валится, если:
#   - модель не компилируется или её примеры не сходятся (fts check, fts test);
#   - две поверхности одной модели дали разные канонические документы;
#   - модель и живой WM разошлись хоть в одном векторе;
#   - харнесс не заметил намеренно испорченной константы.

name: fts-conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Тег инструментария FTS в репозитории языка.  Своего репозитория у него
  # больше нет: прежний адрес - репозиторий "fts" в той же организации -
  # отвечает "Repository not found", и из-за этого шаги ниже не выполнялись
  # ни разу: клон падал раньше их всех.
  #
  # Инструментарий не пропал, он вернулся туда, откуда его когда-то вынесли.
  # 16 августа 2026 старый проект FTS (ядро на TypeScript, девять
  # инструментов, подсветка .fts) вынесли из дерева языка - 357 файлов,
  # 180 755 строк, - и состояние на день выноса сохранили в
  # digitable-lol/flang тегом fts-pered-udaleniem.  Он и берётся здесь.
  #
  # Это ТЕГ, а не ветка, и подставить сюда main нельзя: на main того
  # репозитория живёт уже другой язык, чей компилятор написан на самом себе
  # и .fts не принимает вовсе ("Мост из FTS бинарник не принимает вовсе",
  # bootstrap/flang_repl.c).  Двигать пин тоже некуда: инструментарий
  # заморожен днём выноса и больше не растёт.  Модели живут в этом
  # репозитории, компилятор - нет, и теперь он ещё и не меняется.
  FTS_REF: fts-pered-udaleniem

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать digitwm
        uses: actions/checkout@v4

      - name: Библиотеки для сборки оконного менеджера
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxft-dev libxrandr-dev bison pkg-config \
            clang lld

      - name: Собрать оконный менеджер
        run: make

      # Шов между арифметикой ленты и оконной системой. Утверждение «ribbon.o
      # не берёт у X11 ни одного имени» до сих пор держалось на ручном
      # прогоне - то есть ни на чём: граница, которую никто не сторожит,
      # зарастает первым же вызовом, добавленным по дороге. Скрипт собирает
      # ribbon.c против заглушки без единой функции X11 и требует, чтобы всё,
      # что лента просит у оконной системы, стояло в wsi.h. Библиотек X ему не
      # нужно - заглушка подставляется через -I, - но шаг стоит после сборки,
      # чтобы сначала было видно, что дерево вообще собирается.
      - name: Лента не берёт у X11 ни одного имени, контракт в wsi.h полон
        run: sh tools/no-x-build.sh

      - name: Проба раскладки отвечает без дисплея
        run: ./cwm -C 'layout-probe layout viewport=1280x800 gap=8 border=1 columns=1,3,1 presets=0,2,3 focus=1'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Забрать инструментарий FTS
        run: |
          git clone --depth 1 --branch "$FTS_REF" \
            https://github.com/digitable-lol/flang "$RUNNER_TEMP/fts"
          cd "$RUNNER_TEMP/fts"
          npm ci
          npm run build

      - name: Модели компилируются
        run: |
          for model in fts/*.fts; do
            echo "check $model"
            node "$RUNNER_TEMP/fts/dist/src/cli.js" check "$model" > /dev/null
          done

      - name: Примеры моделей сходятся
        run: |
          for model in fts/*.fts; do
            echo "test $model"
            node "$RUNNER_TEMP/fts/dist/src/cli.js" test "$model" > /dev/null
          done

      - name: Обе поверхности дают один канонический документ
        run: node fts/harness/surfaces.mjs --fts "$RUNNER_TEMP/fts"

      - name: Модели против живого оконного менеджера
        run: node fts/harness/conformance.mjs --fts "$RUNNER_TEMP/fts" --wm ./cwm

      - name: Харнесс замечает испорченную константу
        run: node fts/harness/selftest.mjs --fts "$RUNNER_TEMP/fts" --wm ./cwm

      # Оба обещания ленты говорят об отношении двух её состояний, а не об
      # одном числе, поэтому ни одна из семи моделей их не выражает и
      # проверяет их отдельный харнесс. Инструментарий FTS ему не нужен: он
      # спрашивает только оконный менеджер.
      - name: Вставка окна не трогает соседей, фокус всегда во вьюпорте по обеим осям
        run: node fts/harness/invariants.mjs --wm ./cwm

      - name: Харнесс инвариантов умеет краснеть
        run: node fts/harness/invariants.mjs --wm ./cwm --selfcheck

      - name: Монитор ушёл и вернулся - лента цела
        run: node fts/harness/hotplug.mjs --wm ./cwm

      - name: Харнесс мониторов умеет краснеть
        run: node fts/harness/hotplug.mjs --wm ./cwm --selfcheck

      # Сборка ленты в WebAssembly - не отдельный продукт, а тот же ribbon.c,
      # и единственное, что делает её честной, - совпадение ответов с двоичным
      # файлом. Проверка здесь, чтобы модуль не мог разойтись с исходником
      # молча: разойдётся - сборка покраснеет.
      - name: Лента в WebAssembly отвечает как двоичный файл
        run: |
          sh tools/wasm-layout/build.sh
          node tools/wasm-layout/check.mjs --wm ./cwm --cases 500

      # Замерщик мелькания для macOS собрать здесь нечем, но согласовать его с
      # тем, чем мы считаем Accessibility API, можно и на Linux.
      - name: Замерщик macOS согласован с заголовками, какими мы их знаем
        run: sh tools/macos-flicker/stub-build.sh
