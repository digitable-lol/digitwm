# Спеки раскладки против живого оконного менеджера.
#
# Здесь и только здесь исполняются спеки. В самом digitwm их нет: оконный
# менеджер собирается компилятором C, yacc и тремя библиотеками X, и ни flang,
# ни Node на машине пользователя не нужны - иначе NetBSD отпадает.
#
# Сборка валится, если:
#   - спека не проверяется или её примеры не сходятся (flang check, flang test);
#   - два вида одного обещания - основной и `en:` - говорят разное;
#   - спека и живой WM разошлись хоть в одном векторе или хоть в одном знаке
#     целой раскладки;
#   - сверка не заметила намеренно испорченного ответа C.
#
# ЧЕГО ЗДЕСЬ БОЛЬШЕ НЕТ. До этой правки job тянул замороженный инструментарий
# FTS - тег `fts-pered-udaleniem` в репозитории языка, ядро на TypeScript,
# 357 файлов, - и гонял им пять шагов через Node. Инструментарий больше не
# нужен: политики переехали на flang, а с ними и сверка. Пин снят не потому,
# что «устарел», а потому, что читать `.fts` в дереве стало нечему - моделей
# `.fts` в нём нет.
#
# Node остался ровно у двух харнессов - `invariants.mjs` и `hotplug.mjs`, -
# и у проверки сборки ленты в WebAssembly. Почему именно они, сказано в их
# шапках.
#
# ОДИН JOB ВМЕСТО ДВУХ. Прежде рядом стоял второй гейт `flang-gate`: он брал
# компилятор с `main`, тогда как первый job работал замороженным тегом, и
# смысл разделения был в том, чтобы расхождение с живым языком не смешивалось
# с падением замороженного. Замороженного нет; язык остался один, и job тоже
# один - иначе оконный менеджер собирался бы дважды ради одного и того же.

name: fts-conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      # Полная история и подмодуль. История - потому что
      # tools/check-ribbon-flang.sh берёт эталон из пришпиленного коммита
      # (`git show bfd5d85:ribbon.c`), и мелкий клон его не содержит.
      # Подмодуль - потому что `make -C ribbon-flang verify` перепечатывает из
      # него и сравнивает с деревом; на саму сборку оконного менеджера
      # подмодуль не нужен вовсе, напечатанное лежит в дереве.
      - name: Забрать digitwm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Библиотеки для сборки оконного менеджера
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxft-dev libxrandr-dev bison pkg-config \
            clang lld

      - name: Собрать оконный менеджер
        run: make

      # Шов между арифметикой ленты и оконной системой. Утверждение «ribbon.o
      # не берёт у X11 ни одного имени» до сих пор держалось на ручном
      # прогоне - то есть ни на чём: граница, которую никто не сторожит,
      # зарастает первым же вызовом, добавленным по дороге. Скрипт собирает
      # ribbon.c против заглушки без единой функции X11 и требует, чтобы всё,
      # что лента просит у оконной системы, стояло в wsi.h. Библиотек X ему не
      # нужно - заглушка подставляется через -I, - но шаг стоит после сборки,
      # чтобы сначала было видно, что дерево вообще собирается.
      - name: Лента не берёт у X11 ни одного имени, контракт в wsi.h полон
        run: sh tools/no-x-build.sh

      # Главная проверка этой правки: арифметика ленты больше не написана в
      # ribbon.c, она приезжает напечатанной из flang. Вопрос ровно один -
      # отвечает ли лента ТЕМИ ЖЕ числами, - и отвечает на него не «тесты
      # прошли», а два потока байт и cmp на сетке в 526 871 вход. Отрицательный
      # контроль идёт тем же прогоном: копия напечатанного портится, и
      # требуется красное.
      #
      # Компилятор flang этому шагу не нужен: напечатанное лежит в дереве.
      - name: Лента отвечает как до flang - 526 871 вход, побайтно
        run: sh tools/check-ribbon-flang.sh

      - name: Проба раскладки отвечает без дисплея
        run: ./cwm -C 'layout-probe layout viewport=1280x800 gap=8 border=1 columns=1,3,1 presets=0,2,3 focus=1'

      # Файл настроек ищется в четыре шага, и порядок один на две сборки:
      # confpath.c компилируют обе. Здесь спрашивается сборка X11; ту же
      # таблицу по mac-цели прогоняет macos/check.sh ниже, поэтому расхождение
      # двух порядков покраснеет здесь же и в тот же прогон.
      - name: Настройки ищутся в обещанном порядке (X11)
        run: sh tools/check-config-order.sh ./cwm

      - name: Сторож порядка умеет краснеть
        run: sh tools/check-config-order.sh --selfcheck

      # Компилятор flang - один двоичный файл, которому нужен только cc, и
      # берётся он с `main`, а не тегом: расхождение с живым языком обязано
      # быть видно сразу, а не через полгода. Дальше на нём стоит всё - и
      # перепечатка библиотеки ленты, и обе сверки со спеками.
      - name: Компилятор flang
        run: |
          git clone --depth 1 https://github.com/digitable-lol/flang.git "$RUNNER_TEMP/flang"
          make -C "$RUNNER_TEMP/flang/bootstrap" -j4
          echo "$RUNNER_TEMP/flang/bootstrap" >> "$GITHUB_PATH"

      - name: Библиотека проверяется своими примерами
        run: make -C ribbon-flang check

      # Шаг стоит отдельно от сборки затем, чтобы его падение читалось как
      # «дерево разошлось с библиотекой», а не как «не собралось».
      - name: Напечатанное в дереве - это то, что печатает подмодуль
        run: make -C ribbon-flang verify

      # ------------------------------------------------------------------
      # Спеки раскладки. Всё, что ниже до харнессов на Node, - flang.
      # ------------------------------------------------------------------

      # Все спеки каталога, а не одна названная: файл, добавленный в
      # fts/flang/ и не проверенный сборкой, - это ровно та дыра, из-за
      # которой две политики полтора дня жили в C без модели вовсе.
      - name: Спеки проверены, и ведомости доказательств напечатаны
        run: |
          for m in fts/flang/*.flang; do
            echo "== $m"
            flang check "$m" --proof
          done

      - name: Примеры спек сходятся
        run: |
          for m in fts/flang/*.flang; do
            flang test "$m"
          done

      # Вторая поверхность спеки - вид обещания с меткой `en:`. Компилятор
      # 0.7.10 сверяет её цель с целью основного НЕ БОЛЬШЕ, чем сверял бы
      # любые два разных обещания: ослабленный вид проходит молча. Сторож
      # ниже - то, что осталось от `surfaces.mjs`, и он же показывает, что
      # умеет краснеть.
      - name: Оба вида обещания говорят одно и то же
        run: sh tools/check-flang-en-views.sh

      - name: Сторож поверхностей умеет краснеть
        run: sh tools/check-flang-en-views.sh --selfcheck

      # Двести один вектор через живой двоичный файл и через спеку. Это то,
      # чего `flang test` не делает: примеры спеки - снимок, снятый когда-то,
      # а здесь оба счёта идут сегодня и порознь.
      - name: Спеки против живого оконного менеджера - 201 вектор
        run: flang io fts/flang/conformance.flang

      # Целые сценарии: спека печатает то же, что печатает probe, и сверяются
      # два потока байт целиком - не список полей, написанный руками.
      - name: Целая раскладка сходится знак в знак - 14 сценариев
        run: flang io fts/flang/layout.flang

      # Отрицательный контроль обеих сверок: ответ C портится подменой
      # двоичного файла оболочкой, и требуется красное с именем.
      - name: Сверки умеют краснеть
        run: sh tools/check-flang-mutants.sh

      # ------------------------------------------------------------------
      # Харнессы, которые на flang не переехали. Почему - в их шапках.
      # ------------------------------------------------------------------

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Оба обещания ленты говорят об отношении двух её состояний, а не об
      # одном числе, поэтому ни одна из семи моделей их не выражает и
      # проверяет их отдельный харнесс. Инструментарий FTS ему не нужен: он
      # спрашивает только оконный менеджер.
      - name: Вставка окна не трогает соседей, фокус всегда во вьюпорте по обеим осям
        run: node fts/harness/invariants.mjs --wm ./cwm

      - name: Харнесс инвариантов умеет краснеть
        run: node fts/harness/invariants.mjs --wm ./cwm --selfcheck

      - name: Монитор ушёл и вернулся - лента цела
        run: node fts/harness/hotplug.mjs --wm ./cwm

      - name: Харнесс мониторов умеет краснеть
        run: node fts/harness/hotplug.mjs --wm ./cwm --selfcheck

      # Сборка ленты в WebAssembly - не отдельный продукт, а тот же ribbon.c,
      # и единственное, что делает её честной, - совпадение ответов с двоичным
      # файлом. Проверка здесь, чтобы модуль не мог разойтись с исходником
      # молча: разойдётся - сборка покраснеет.
      - name: Лента в WebAssembly отвечает как двоичный файл
        run: |
          sh tools/wasm-layout/build.sh
          node tools/wasm-layout/check.mjs --wm ./cwm --cases 500

      # Замерщик мелькания для macOS собрать здесь нечем, но согласовать его с
      # тем, чем мы считаем Accessibility API, можно и на Linux.
      - name: Замерщик macOS согласован с заголовками, какими мы их знаем
        run: sh tools/macos-flicker/stub-build.sh

      # Половина macOS-порта, которая ни в каком macOS не нуждается: та же ли
      # раскладка выходит у ленты поверх порта, что у ленты поверх X11, и
      # делает ли точка входа то, что обещает, - запуск, чтение cwmrc, разбор
      # клавиши, возврат окна, которое подвинул кто-то другой. Здесь же
      # линкуется двоичный файл целиком, кроме двух файлов на Objective-C.
      - name: Порт macOS считает то же, что X11, и его точка входа работает
        run: sh macos/check.sh 400

      # А это - единственное, что можно сказать про два файла на Objective-C
      # без мака: согласованы ли они с тем, чем мы считаем Accessibility API
      # и Carbon Event Manager.
      - name: wsi_ax.m и wsi_key.m согласованы с API, каким мы его знаем
        run: sh macos/stub-build.sh

  # ВТОРОЙ ГЕЙТ: числа документа против дерева.
  #
  # `doc/portability.md` рядом с каждым числом называет команду, которой оно
  # снимается, - и до сих пор эти команды никто не запускал. За историю файла
  # числа расходились дважды (см. `git log -- doc/portability.md`), и оба раза
  # это находил человек, а не сборка.
  #
  # Job отдельный и намеренно пустой: ни X, ни node, ни flang. Дерево может не
  # собираться по любой причине - расхождение документа с деревом обязано быть
  # видно всё равно.
  doc-numbers:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать digitwm
        uses: actions/checkout@v4

      - name: Числа документа сходятся с деревом
        run: sh tools/check-doc-numbers.sh
